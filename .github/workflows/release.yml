# Builds the Windows installer and attaches it to a GitHub release when a
# version tag is pushed (git tag v0.2.0, then git push origin v0.2.0). The
# website's Download button always points at the newest release.
name: Installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
      - name: Attach the installer and the update files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/Hunting-Hub-Setup.exe release/Hunting-Hub-Setup.exe.blockmap release/latest.yml --title "Hunting Hub $GITHUB_REF_NAME" --generate-notes
